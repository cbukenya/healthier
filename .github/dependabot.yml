version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR a week for routine updates; major versions arrive one at a time.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types track the Node version the image runs (node:24); move both together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the current Node LTS line; move to the next one deliberately.
      - dependency-name: node
        update-types: [version-update:semver-major]
