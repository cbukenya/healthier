name: Feature request
description: Suggest an improvement to how Healthier works or looks.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For a new insight card or lab, the **Insight or lab idea** template asks the questions that help most.
        **Never paste health data, tokens or your `.env` here.**
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
