name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste health data, tokens or your `.env` here.**
        For security problems, use [private reporting](https://github.com/cbukenya/healthier/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag you run (HEALTHIER_VERSION), or the commit if built from source.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How do you run it?
      options:
        - docker compose (published image)
        - docker compose (built from source)
        - npm run dev
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs app`, with anything personal removed.
      render: shell
