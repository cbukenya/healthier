name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release runs this first, so a tag can only publish code that passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/cbukenya/healthier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Unit tests never start the production server. Run the image the way
      # self-hosters do, with Postgres and docker-compose.yml, and check it
      # boots, migrates and serves. A green build is not a working image.
      - name: Start with Postgres and smoke-test
        run: |
          cat > .env <<EOF
          HEALTHIER_VERSION=ci
          GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=ci
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          EOF
          docker compose up -d
          for i in $(seq 1 45); do curl -fsS http://localhost:3000/healthz && break; sleep 2; done
          set -x
          curl -fsS http://localhost:3000/healthz | grep -q '"ok":true'
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/some/client/route | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/me)" = 401
          curl -sI http://localhost:3000/auth/google | grep -qi '^location: https://accounts.google.com/'
          docker compose logs app | grep -q 'Applied migration 1'
      - name: Container logs
        if: failure()
        run: docker compose logs
