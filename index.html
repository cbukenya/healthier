<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthier</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Lets phones and computers install Healthier as an app: its own window, no browser bars. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Opens in the theme this device last showed (src/hooks/useTheme.tsx) before anything draws,
      // with the browser's bar in the page's colour (src/theme.css).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('healthier.theme'); } catch (e) {}
        var light = theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]').content = light ? '#f4f4f5' : '#000000';
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = light ? 'default' : 'black';
      })();
    </script>
    <meta name="description" content="A personal health and fitness dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&display=swap" rel="stylesheet">
    <meta property="og:title" content="Healthier" />
    <meta property="og:description" content="A personal health and fitness dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
